    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background: #222;
            color: white;
            font-family: sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 10px;
            font-size: 24px;
        }

        /* ゲーム画面 */
        #gameContainer {
            position: relative;
            width: 70vw;
            height: 60vh;
            overflow: hidden;
            /*max-width: 500px;*/
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #444;
        }

        /* スコア表示 */
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 2px #000;
            z-index: 10;
        }

        /* ゲームオーバー画面 */
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20;
        }

        #gameOver h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        #restartButton {
            font-size: 22px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #000;


            touch-action: manipulation;

            position: relative;
            z-index: 2000;
        }

        /* タッチ操作エリア */
        #touchArea {
            width: 100vw;
            height: 40vh;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #aaa;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 40;
        }

        #startButton {
            font-size: 24px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #ffcc00;
            cursor: pointer;
        }

}

/* =========================
   ゲーム変数
========================= */

let obstacles = [];

let score = 0;

let gameRunning = false;

let roadOffset = 0;

let obstacleTimer = 0;

let gameSpeed = 5;

//let gameOver = false;

let gameStarted = false;


/* =========================
   道路を描画
========================= */

function drawRoad() {
    /* 道路 */
    ctx.fillStyle = "#555";
    ctx.fillRect( 0, 0, canvas.width, canvas.height);

    /* 左右の道路線 */
    ctx.fillStyle = "white";
    ctx.fillRect( 10, 0, 5, canvas.height );
    ctx.fillRect( canvas.width - 15, 0, 5, canvas.height );

    /* 中央の点線 */
    ctx.fillStyle = "white";
    const lineHeight = 40;
    const gap = 80;
    for ( let y = roadOffset - gap; y < canvas.height; y += gap) {
        ctx.fillRect( canvas.width / 2 - 5, y, 10, lineHeight );
    }
}

/* =========================
   車を描画
========================= */

function drawPlayer() {

    if (!playerImage.complete ||
        playerImage.naturalWidth === 0) {
        return;
    }

    ctx.drawImage(
        playerImage,
        player.x,
        player.y,
        player.width,
        player.height
    );

    //console.log("Draw Player");
}
/* =========================
   障害物を作成
========================= */

function selectEnemyType() {

    const totalWeight = enemyTypes.reduce(
        (sum, type) => sum + type.weight,
        0
    );

    let random = Math.random() * totalWeight;

    for (const type of enemyTypes) {

        random -= type.weight;

        if (random < 0) {
            return type;
        }
    }

    console.log("enemyTypes:", enemyTypes[enemyTypes.length - 1]);

    return enemyTypes[enemyTypes.length - 1];
}

function createObstacle() {

    // 敵車をランダムに選択
    const index = Math.floor(
        Math.random() * enemyTypes.length
    );

    //const type = enemyTypes[index];
    const type = selectEnemyType();

    // 車の幅と高さ
    const width = type.width;
    const height = type.height;

    // 道路内の出現位置
    const minX = 20;

    const maxX = canvas.width - width - 20;

    const x =
        minX +
        Math.random() * Math.max(0, maxX - minX);

    // 障害物を追加
    obstacles.push({
        x: x,
        y: -height,
        width: width,
        height: height,
        speed: type.speed,
        image: type.image
    });
}

/* =========================
   障害物を描画
========================= */

function drawObstacle(obstacle) {

    if (!obstacle.image.complete ||
        obstacle.image.naturalWidth === 0) {
        return;
    }

    ctx.drawImage(
        obstacle.image,
        obstacle.x,
        obstacle.y,
        obstacle.width,
        obstacle.height
    );

}

/* =========================
   障害物を移動
========================= */

function updateObstacles() {

    for ( let i = obstacles.length - 1; i >= 0; i-- ) {
        const obstacle = obstacles[i];

        obstacle.y += gameSpeed;

        /* 画面外なら削除 */
        if ( obstacle.y > canvas.height ) {
            obstacles.splice( i, 1 );

            score++;
            scoreElement.textContent = "SCORE: " + score;

            continue;
        }

        /* 衝突判定 */
        if ( player.x < obstacle.x + obstacle.width
        && player.x + player.width > obstacle.x
        && player.y < obstacle.y + obstacle.height
        && player.y + player.height > obstacle.y ) {
            gameOver();
        }
    }
}

/* =========================
   車を移動
========================= */

function updatePlayer() {

    if (moveLeft) { 
        player.x -= player.speed; 
    }

    if (moveRight) {
        player.x += player.speed;
    }

    /* 画面外に出ないようにする */
    if ( player.x < 20) {
        player.x = 20;
    }

    if ( player.x + player.width > canvas.width - 20) {
        player.x = canvas.width - player.width - 20;
    }

    //
    //    console.log("L533 player.x=",player.x,", player.y=",player.y,", player.width=",player.width,", player.height=",player.height);
}

========================= */

const touchArea = document.getElementById( "touchArea");

let controlling = false;

/* タッチ位置に車を移動 */
function movePlayerToPointer(event) {

    const rect = touchArea.getBoundingClientRect();

    /* タッチ領域内でのX座標 */
    //const touchX = event.clientX - rect.left;

    /* タッチ領域の座標をCanvas座標に変換 */
    //const canvasX = touchX * canvas.width / rect.width;
    const canvasX = event.clientX - rect.width * 0.15;  //タッチ領域の左端からの距離をCanvas座標に変換

    //
    //    console.log("L557 touchX=",event.clientX,", rect.width=",rect.width,", canvasX=",canvasX);

    /* 指の位置が車の中心になるようにする */
    player.x = canvasX - player.width / 2;

    /* 左側にはみ出さない */
    if ( player.x < 0 ) {
        player.x = 0;
    }

    /* 右側にはみ出さない */
    if ( player.x > canvas.width - player.width ) {
        player.x = canvas.width - player.width;
    }
}

    const canvasX = centroidX - rect.width * 0.15;  //タッチ領域の左端からの距離をCanvas座標に変換

    //
    //    console.log("L586 centroidX=",centroidX,", rect.width=",rect.width,", canvasX=",canvasX);

    /* 指の位置が車の中心になるようにする */
    player.x = canvasX - player.width / 2;

    /* 左側にはみ出さない */
    if ( player.x < 0 ) {
        player.x = 0;
    }

    /* 右側にはみ出さない */
    if ( player.x > canvas.width - player.width ) {
        player.x = canvas.width - player.width;
    }
}

            ...enemyTypes.map(type => type.image.decode())
        ]);

    }

/* =========================
   メインゲームループ
========================= */

function gameLoop() {

    ctx.clearRect(
        0, 0, canvas.width, canvas.height       //gameWidth, gameHeight
    );

    //updateRoadPosition();

    // 道路を描画
    drawRoad();

    // ゲーム中だけ更新
    if (gameStarted && gameRunning) {

        roadOffset += gameSpeed;

        if (roadOffset > 80) {
            roadOffset = 0;
        }

        obstacleTimer++;

        if (obstacleTimer > 70) {
            createObstacle();
            obstacleTimer = 0;
        }

        updateObstacles();
    }

    // 障害物を描画
    for (const obstacle of obstacles) {
        drawObstacle(obstacle);
    }

    // 自分の車を描画
    drawPlayer();

    requestAnimationFrame(gameLoop);
}
