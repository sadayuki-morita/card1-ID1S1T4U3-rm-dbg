const ctx = canvas.getContext("2d");

/* =========================
   画面サイズ設定
========================= */

function resizeCanvas() {

    canvas.width = Math.floor( window.innerWidth * 0.7);

    canvas.height = Math.floor( window.innerHeight * 0.6);

    /* リサイズ後に車が画面外へ出ないようにする */

    if ( player.x + player.width > canvas.width) {
        player.x = canvas.width - player.width;
    }

    player.y = canvas.height - player.height - 20;
}

window.addEventListener( "resize", resizeCanvas );

/* =========================
   プレイヤーの車
========================= */

const player = {
    width: 50,
    height: 80,
    x: 0,
    y: 0,
    //speed: 8
};

/* ここでCanvasサイズ設定 */
resizeCanvas();

function resetPlayer() {
    player.x = canvas.width / 2 - player.width / 2;
    player.y = canvas.height - player.height - 20;
}

window.addEventListener( "resize", function() {
    resizeCanvas();
    player.y = canvas.height - player.height - 20;
});

/* =========================
   ゲーム変数
========================= */

let obstacles = [];

let score = 0;

let gameRunning = true;

let roadOffset = 0;

let obstacleTimer = 0;

let gameSpeed = 5;


/* =========================
   道路を描画
========================= */

function drawRoad() {
    /* 道路 */
    ctx.fillStyle = "#555";
    ctx.fillRect( 0, 0, canvas.width, canvas.height);

    /* 左右の道路線 */
    ctx.fillStyle = "white";
    ctx.fillRect( 10, 0, 5, canvas.height );
    ctx.fillRect( canvas.width - 15, 0, 5, canvas.height );

    /* 中央の点線 */
    ctx.fillStyle = "white";
    const lineHeight = 40;
    const gap = 80;
    for ( let y = roadOffset - gap; y < canvas.height; y += gap) {
        ctx.fillRect( canvas.width / 2 - 5, y, 10, lineHeight );
    }
}

/* =========================
   車を描画
========================= */

function drawPlayer() {

    const x = player.x;

    const y = player.y;

    const w = player.width;

    const h = player.height;

    /* 車体 */
    ctx.fillStyle = "red";
    ctx.fillRect( x, y, w, h );

    /* フロントガラス */
    ctx.fillStyle = "#9ddcff";
    ctx.fillRect( x + 8, y + 10, w - 16, 25 );

    /* タイヤ */
    ctx.fillStyle = "black";
    ctx.fillRect( x - 5, y + 10, 5, 20 );
    ctx.fillRect( x + w, y + 10, 5, 20 );
    ctx.fillRect( x - 5, y + h - 30, 5, 20 );
    ctx.fillRect( x + w, y + h - 30, 5, 20 );

    //
    //    console.log("L436 player.x=",player.x,", player.y=",player.y,", player.width=",player.width,", player.height=",player.height);
}

/* =========================
   障害物を作成
========================= */

function createObstacle() {

    const width = 50;

    const height = 70;

    const x = 30 + Math.random() * ( canvas.width - width - 60 );

    obstacles.push({
        x: x,
        y: -height,
        width: width,
        height: height
    });
}

/* =========================
   障害物を描画
========================= */

function drawObstacles() {

    ctx.fillStyle = "blue";

    for ( const obstacle of obstacles) {
        ctx.fillRect( obstacle.x, obstacle.y, obstacle.width, obstacle.height );

        /* 窓 */
        ctx.fillStyle = "#aaddff";
        ctx.fillRect( obstacle.x + 8, obstacle.y + 10, obstacle.width - 16, 20 );

        ctx.fillStyle = "blue";
    }
}

/* =========================
   障害物を移動
========================= */

function updateObstacles() {

    for ( let i = obstacles.length - 1; i >= 0; i-- ) {
        const obstacle = obstacles[i];

        obstacle.y += gameSpeed;

        /* 画面外なら削除 */
        if ( obstacle.y > canvas.height ) {
            obstacles.splice( i, 1 );

            score++;
            scoreElement.textContent = "SCORE: " + score;

            continue;
        }

        /* 衝突判定 */
        if ( player.x < obstacle.x + obstacle.width
        && player.x + player.width > obstacle.x
        && player.y < obstacle.y + obstacle.height
        && player.y + player.height > obstacle.y ) {
            gameOver();
        }
    }
}

/* =========================
   車を移動
========================= */

function updatePlayer() {

    if (moveLeft) { 
        player.x -= player.speed; 
    }

    if (moveRight) {
        player.x += player.speed;
    }

    /* 画面外に出ないようにする */
    if ( player.x < 20) {
        player.x = 20;
    }

    if ( player.x + player.width > canvas.width - 20) {
        player.x = canvas.width - player.width - 20;
    }

    //
    //    console.log("L533 player.x=",player.x,", player.y=",player.y,", player.width=",player.width,", player.height=",player.height);
}

/* =========================
   タッチ操作
========================= */

const touchArea = document.getElementById( "touchArea");

let controlling = false;

/* タッチ位置に車を移動 */
function movePlayerToPointer(event) {

    const rect = touchArea.getBoundingClientRect();

    /* タッチ領域内でのX座標 */
    //const touchX = event.clientX - rect.left;

    /* タッチ領域の座標をCanvas座標に変換 */
    //const canvasX = touchX * canvas.width / rect.width;
    const canvasX = event.clientX - rect.width * 0.15;  //タッチ領域の左端からの距離をCanvas座標に変換

    //
    //    console.log("L557 touchX=",event.clientX,", rect.width=",rect.width,", canvasX=",canvasX);

    /* 指の位置が車の中心になるようにする */
    player.x = canvasX - player.width / 2;

    /* 左側にはみ出さない */
    if ( player.x < 0 ) {
        player.x = 0;
    }

    /* 右側にはみ出さない */
    if ( player.x > canvas.width - player.width ) {
        player.x = canvas.width - player.width;
    }
}

/* 重心位置に車を移動 */
function movePlayerToCentroid(centroidX) {

    const rect = touchArea.getBoundingClientRect();

    /* タッチ領域内でのX座標 */
    //const touchX = event.clientX - rect.left;

    /* タッチ領域の座標をCanvas座標に変換 */
    //const canvasX = touchX * canvas.width / rect.width;
    const canvasX = centroidX - rect.width * 0.15;  //タッチ領域の左端からの距離をCanvas座標に変換

    //
    //    console.log("L586 centroidX=",centroidX,", rect.width=",rect.width,", canvasX=",canvasX);

    /* 指の位置が車の中心になるようにする */
    player.x = canvasX - player.width / 2;

    /* 左側にはみ出さない */
    if ( player.x < 0 ) {
        player.x = 0;
    }

    /* 右側にはみ出さない */
    if ( player.x > canvas.width - player.width ) {
        player.x = canvas.width - player.width;
    }
}

/* =========================
   ゲームオーバー
========================= */

function gameOver() {

    gameRunning = false;
    finalScoreElement.textContent = "あなたのスコア: " + score;
    gameOverElement.style.display = "flex";
}

/* =========================
   リスタート
========================= */

function restartGame() {

    obstacles = [];

    score = 0;

    gameSpeed = 5;

    obstacleTimer = 0;

    gameRunning = true;

    scoreElement.textContent = "SCORE: 0";

    gameOverElement.style.display = "none";

    resetPlayer();
}

//restartButton.addEventListener( "click", restartGame) ;

/* =========================
   メインゲームループ
========================= */

function gameLoop() {

    if (gameRunning) {

        /* 車の移動 */
        //updatePlayer();

        /* 道路の移動 */
        roadOffset += gameSpeed;

        if ( roadOffset > 80 ) {
            roadOffset = 0;
        }

        /* 障害物作成 */
        obstacleTimer++;

        if ( obstacleTimer > 70 ) {
            createObstacle();
            obstacleTimer = 0;
        }

        /* 障害物更新 */
        updateObstacles();

        /* 少しずつ難しくする */
        gameSpeed = 5 + score * 0.1;

        /* 画面を描画 */

        drawRoad();

        drawObstacles();

        drawPlayer();
    }

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();
